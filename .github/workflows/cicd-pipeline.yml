name: Three Tier CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
  

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Build Frontend Image
      - name: Build Frontend Image
        run: |
          docker build \
          -t nomandev1011/three-tier-frontend:latest \
          -f Application-Code/frontend/Dockerfile \
          Application-Code/frontend

      # Build Backend Image
      - name: Build Backend Image
        run: |
          docker build \
          -t nomandev1011/three-tier-backend:latest \
          -f Application-Code/backend/Dockerfile \
          Application-Code/backend

      # Install Helm
      - name: Install Helm
        uses: azure/setup-helm@v4

      # Validate Helm Chart
      - name: Validate Helm Chart
        run: |
          helm lint ./three-tier-app
          helm template ./three-tier-app

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Push Frontend Image
      - name: Push Frontend Image
        run: |
          docker push nomandev1011/three-tier-frontend:latest

      # Push Backend Image
      - name: Push Backend Image
        run: |
          docker push nomandev1011/three-tier-backend:latest

      # Install kubectl
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      # Configure kubeconfig
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      # Verify Kubernetes Cluster
      - name: Verify Kubernetes Cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      # Deploy Helm Chart
      - name: Deploy Application
        run: |
          helm upgrade --install three-tier-app ./three-tier-app \
            --namespace three-tier-namespace \
            --create-namespace
