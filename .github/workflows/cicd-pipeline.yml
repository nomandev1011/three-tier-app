name: Three Tier CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the frontend image
        run: docker build Application-Code/frontend/ --file Application-Code/frontend/Dockerfile --tag nomandev1011/three-tier-frontend:latest

      - name: Build the backend image
        run: docker build Application-Code/backend/ --file Application-Code/backend/Dockerfile --tag nomandev1011/three-tier-backend:latest
     
      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm Chart
        run: |
          helm lint ./three-tier-app
          helm template ./three-tier-app
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push Frontend Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/three-tier-frontend:latest
      - name: Push Backend Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/three-tier-backend:latest


        
